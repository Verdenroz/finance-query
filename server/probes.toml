# Data-quality probes for `cargo soothfast spec probe -p finance-query-server`.
#
# Each probe fires one request at a locally launched server and holds the
# response to three checks: field population against probes.lock, structure
# against openapi.yaml's response schema, and the assertions below. Live
# Yahoo data varies by market hours — fields that legitimately come and go
# are pinned `sometimes` here or demoted by repeated `--accept` runs.

[probes]
spec = "openapi.yaml"
command = "../target/release/finance-query-server"
env = { PORT = "0", HOST = "127.0.0.1" }

[[probe]]
name = "quote"
path = "/v2/quote/AAPL"
sometimes = ["preMarket*", "postMarket*", "bid", "bidSize", "ask", "askSize"]
assert = [
  "symbol == \"AAPL\"",
  "regularMarketPrice > 0",
  "forwardPe > 0",
  "trailingPe > 0",
  "week52Change exists",
  "marketCap > 0",
]

# Probes with `shape = false`: their spec response declares the GraphQL
# Connection shape (Page_*) for paginated list fields, but REST unwraps to a
# bare array by default (see server.md, Pagination) — or, for transcripts,
# requires `paragraphs`, which the REST default selection deliberately
# excludes. Shape validation stays off until the generated spec models the
# REST default shape.

# POST routes are not probed and cannot be: `cargo soothfast spec probe`
# writes a literal `GET {path}` request and its probe entry has no method or
# body field. That covers `/v2/screeners/custom` and `/v2/backtest/{symbol}`,
# whose request contracts are covered by unit tests in their handlers instead.

[[probe]]
name = "quotes-batch"
shape = false
path = "/v2/quotes?symbols=AAPL,MSFT"
assert = ["quotes[].regularMarketPrice > 0"]

[[probe]]
name = "quote-type"
path = "/v2/quote-type/AAPL"

[[probe]]
name = "chart-daily"
shape = false
path = "/v2/chart/AAPL?interval=1d&range=1mo"
assert = [
  "meta.chartPreviousClose > 0",
  "meta.regularMarketPrice > 0",
  "candles#len >= 1",
  "candles[].close > 0",
]

[[probe]]
name = "chart-intraday"
shape = false
path = "/v2/chart/AAPL?interval=5m&range=1d"
assert = ["meta.previousClose > 0", "candles#len >= 1"]

