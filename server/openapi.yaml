        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  "/v2/cftc/cot/{symbol}":
    get:
      operationId: getCommitmentsOfTraders
      summary: Weekly CFTC Commitments of Traders positioning (keyless)
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            description: "Opaque continuation cursor from a previous response's `pageInfo.endCursor`"
            type: string
        - name: fields
          in: query
          required: false
          schema:
            description: Comma-separated list of fields to include in response
            type: string
        - name: limit
          in: query
          required: false
          schema:
            description: "Max weekly observations per page; omitted (with cursor also omitted) =\nevery observation as a bare array"
            type: integer
            format: int32
            minimum: 0
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
