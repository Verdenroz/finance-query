  "/v2/chart/{symbol}":
    get:
      operationId: getChart
      summary: Get historical chart data
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            description: "Opaque continuation cursor from a previous response's `pageInfo.endCursor`"
            type: string
        - name: end
          in: query
          required: false
          schema:
            description: "End date as Unix timestamp (seconds). Defaults to now when `start` is set."
            type: integer
            format: int64
        - name: events
          in: query
          required: false
          schema:
            description: "Include events (dividends, splits, capital gains) in response"
            type: boolean
        - name: fields
          in: query
          required: false
          schema:
            description: Comma-separated list of fields to include in response
            type: string
        - name: interval
          in: query
          required: false
          schema:
            description: "Candle interval (e.g. 1m, 5m, 1h, 1d; default: 1d)"
            $ref: "#/components/schemas/Interval"
        - name: limit
          in: query
          required: false
          schema:
            description: "Max candles per page; omitted (with cursor also omitted) = every matching\ncandle as a bare array, unchanged from pre-pagination behavior"
            type: integer
            format: int32
            minimum: 0
        - name: patterns
          in: query
          required: false
          schema:
            description: "Detect candlestick patterns and include per-candle signals in response.\nThe `patterns` array aligns 1:1 with the `candles` array; `null` means\nno pattern was detected on that bar."
            type: boolean
        - name: range
          in: query
          required: false
          schema:
            description: "Time range (e.g. 1d, 5d, 1mo, 1y, max; default: 1mo)"
            $ref: "#/components/schemas/TimeRange"
        - name: start
          in: query
          required: false
          schema:
            description: "Start date as Unix timestamp (seconds). When provided together with `end`,\noverrides `range` and uses absolute date boundaries."
            type: integer
            format: int64
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GqlChart"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Symbol or resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limited (global token bucket)
          content:
