openapi: 3.1.0
info:
  title: Finance Query v2
  version: 2.8.0
  description: High-performance financial data API server built on finance-query library
servers:
  - url: "https://finance-query.com"
  - url: "http://localhost:8000"
paths:
  "/v2/analysis/{symbol}/{type}":
    get:
      operationId: getAnalysis
      summary: Get analysis data
      parameters:
        - name: fields
          in: query
          required: false
          schema:
            description: Comma-separated list of fields to include in response
            type: string
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AnalysisType"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Symbol or resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limited (global token bucket)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitError"
          headers:
            Retry-After:
              schema:
                type: string
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v2/calendar:
    get:
      operationId: getCalendar
      summary: Get upcoming financial event calendar
      parameters:
        - name: fields
          in: query
          required: false
          schema:
            description: Comma-separated list of fields to include in response
            type: string
        - name: range
          in: query
          required: false
          schema:
            description: "Forward window: 1wk/5d, 1mo, 3mo, etc. (default: 1mo)"
            $ref: "#/components/schemas/TimeRange"
        - name: symbols
          in: query
          required: true
          schema:
            description: Comma-separated symbols (required)
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GqlCalendarEvent"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Symbol or resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limited (global token bucket)
          content:
            application/json:
