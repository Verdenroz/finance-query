    PingResponse:
      description: "Body of `GET /v2/ping`."
      type: object
      properties:
        message:
          description: "Always \"pong\"."
          type: string
      required:
        - message
    Quarter:
      description: "Fiscal quarter for `GET /v2/transcripts/{symbol}`."
      type: string
      enum:
        - Q1
        - Q2
        - Q3
        - Q4
    QuoteQuery:
      description: "Query parameters for `GET /v2/quote/{symbol}`."
      type: object
      properties:
        fields:
          description: Comma-separated list of fields to include in response
          type: string
        format:
          description: "Value format: raw, pretty, or both (default: raw)"
          $ref: "#/components/schemas/ValueFormat"
        lang:
          description: "Target language for translated text fields (BCP 47, e.g. \"ja\", \"zh-Hant\");\nfalls back to the Accept-Language header"
          type: string
        logo:
          description: "Whether to include company logo URL (default: false)"
          type: boolean
    QuoteType:
      description: Quote type for custom screener queries.
      type: string
      enum:
        - EQUITY
        - MUTUALFUND
    QuoteTypeQuery:
      description: "Query parameters for `GET /v2/quote-type/{symbol}`."
      type: object
      properties:
        fields:
          description: Comma-separated list of fields to include in response
          type: string
    QuotesQuery:
      description: "Query parameters for `GET /v2/quotes`."
      type: object
      properties:
        cursor:
          description: "Opaque continuation cursor from a previous response's `pageInfo.endCursor`"
          type: string
        fields:
          description: Comma-separated list of fields to include in response
          type: string
        format:
          description: "Value format: raw, pretty, or both (default: raw)"
          $ref: "#/components/schemas/ValueFormat"
        lang:
          description: "Target language for translated text fields (BCP 47, e.g. \"ja\", \"zh-Hant\");\nfalls back to the Accept-Language header"
          type: string
        limit:
          description: "Max symbols per page; omitted (with cursor also omitted) = every requested\nsymbol's quote as a bare array, unchanged from pre-pagination behavior"
          type: integer
          format: int32
          minimum: 0
        logo:
          description: "Whether to include company logo URLs (default: false)"
          type: boolean
        symbols:
          description: Comma-separated symbols (required)
          type: string
      required:
        - symbols
    RangeQuery:
      description: "Query parameters for range-scoped event endpoints\n(`GET /v2/splits/{symbol}`, `GET /v2/capital-gains/{symbol}`)."
      type: object
      properties:
        fields:
          description: Comma-separated list of fields to include in response
          type: string
        range:
          description: "Time range (default: max)"
          $ref: "#/components/schemas/TimeRange"
    RateLimitError:
      description: "Rate limit error body, returned with HTTP 429 and a `Retry-After` header."
      type: object
      properties:
        error:
          description: "Always \"Rate limit exceeded\"."
          type: string
        message:
          description: Human-readable message including the retry delay.
          type: string
        retryAfterSeconds:
          description: Seconds until the next request would be admitted.
          type: integer
          format: int64
          minimum: 0
      required:
        - error
        - message
        - retryAfterSeconds
    RecommendationsQuery:
      description: "Query parameters for `GET /v2/recommendations/{symbol}`."
      type: object
      properties:
        fields:
          description: Comma-separated list of fields to include in response
          type: string
        limit:
          description: Maximum number of similar symbols to return
          type: integer
          format: int32
          minimum: 0
    Region:
      description: Supported regions for Yahoo Finance regional APIs
      type: string
      enum:
        - AR
        - AU
        - BR
        - CA
        - CN
        - DK
        - FI
        - FR
        - DE
        - GR
        - HK
        - IN
