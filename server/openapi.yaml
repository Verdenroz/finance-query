            type: string
        - name: fields
          in: query
          required: false
          schema:
            description: Comma-separated list of fields to include in response
            type: string
        - name: limit
          in: query
          required: false
          schema:
            description: "Max coins per page; omitted (with cursor also omitted) = every fetched\ncoin (up to `count`) as a bare array, unchanged from pre-pagination behavior"
            type: integer
            format: int32
            minimum: 0
        - name: vsCurrency
          in: query
          required: false
          schema:
            description: "Currency to compare against (default: \"usd\")"
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GqlCoinQuote"
        "400":
