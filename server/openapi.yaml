        - top-mutual-funds
    ScreenersQuery:
      description: "Query parameters for `GET /v2/screeners/{screener}`."
      type: object
      properties:
        count:
          description: "Number of results (default: 25, max: 250)"
          type: integer
          format: int32
          minimum: 0
        fields:
          description: Comma-separated list of fields to include in response
          type: string
        format:
          description: "Value format: raw, pretty, or both (default: raw)"
          $ref: "#/components/schemas/ValueFormat"
    SearchQuery:
      description: "Query parameters for `GET /v2/search`."
      type: object
      properties:
        cultural:
          description: "Enable cultural assets/NFT indices (default: false)"
          type: boolean
        cursor:
          description: "Opaque continuation cursor from a previous response's `pageInfo.endCursor`"
          type: string
        fields:
          description: Comma-separated list of fields to include in response
          type: string
        fuzzy:
          description: "Enable fuzzy matching for typos (default: false)"
          type: boolean
        lang:
          description: "Target language for translated text fields (BCP 47, e.g. \"ja\", \"zh-Hant\");\nfalls back to the Accept-Language header"
          type: string
        limit:
          description: "Max quotes per page; omitted (with cursor also omitted) = every fetched\nquote (up to `quotes`) as a bare array, unchanged from pre-pagination behavior"
          type: integer
          format: int32
          minimum: 0
        logo:
          description: "Enable logo URLs in results (default: true)"
          type: boolean
        news:
          description: "Maximum number of news results (default: 0 = disabled)"
          type: integer
          format: int32
          minimum: 0
        q:
          description: Search query string (required)
          type: string
        quotes:
          description: "Maximum number of quote results (default: 6)"
          type: integer
          format: int32
          minimum: 0
        region:
          description: "Region code for lang/region settings (e.g., \"US\", \"JP\", \"GB\")"
          $ref: "#/components/schemas/Region"
        research:
          description: "Enable research reports (default: false)"
          type: boolean
      required:
