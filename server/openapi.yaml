            type: integer
            format: int32
            minimum: 0
        - name: limitResults
          in: query
          required: false
          schema:
            description: "Max matches to fetch (default: 25)"
            type: integer
            format: int32
            minimum: 0
        - name: query
          in: query
          required: true
          schema:
            description: "Free-text query (coin name, symbol, or CoinGecko id)"
