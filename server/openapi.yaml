        - TR
        - GB
        - US
        - VN
    RiskQuery:
      description: "Query parameters for `GET /v2/risk/{symbol}`."
      type: object
      properties:
        benchmark:
          description: "Optional benchmark symbol for beta calculation (e.g., \"SPY\")"
          type: string
        fields:
