components:
  schemas:
    AnalysisQuery:
      description: "Query parameters for `GET /v2/analysis/{symbol}/{type}`."
      type: object
      properties:
        fields:
          description: Comma-separated list of fields to include in response
          type: string
    AnalysisResponse:
      description: "Body of `GET /v2/analysis/{symbol}/{type}` — the shape depends on the\n`{type}` path param (recommendations, upgrades-downgrades,\nearnings-estimate, earnings-history), so the schema is deliberately open."
    AnalysisType:
      description: "Analysis type for `GET /v2/analysis/{symbol}/{type}`."
      type: string
      enum:
        - recommendations
        - upgrades-downgrades
        - earnings-estimate
        - earnings-history
    ApiError:
      description: "Generic REST error body, emitted on 4xx/5xx by the GraphQL bridge and by\nhandlers rejecting invalid path/query input."
      type: object
      properties:
        error:
          description: Human-readable error message.
          type: string
        status:
          description: "HTTP status code, duplicated in the body."
          type: integer
          format: int32
          minimum: 0
      required:
        - error
        - status
    BatchCapitalGainsQuery:
      description: "Query parameters for `GET /v2/capital-gains`."
      type: object
      properties:
        fields:
          description: Comma-separated list of fields to include in response
          type: string
        range:
          description: "Time range (default: max)"
          $ref: "#/components/schemas/TimeRange"
        symbols:
          description: Comma-separated symbols (required)
          type: string
      required:
        - symbols
    BatchChartsQuery:
      description: "Query parameters for `GET /v2/charts`."
      type: object
      properties:
        cursor:
          description: "Opaque continuation cursor from a previous response's `pageInfo.endCursor`"
          type: string
        fields:
          description: Comma-separated list of fields to include in response
          type: string
        interval:
          description: "Candle interval (default: 1d)"
          $ref: "#/components/schemas/Interval"
        limit:
          description: "Max symbols per page; omitted (with cursor also omitted) = every requested\nsymbol's chart as a bare array, unchanged from pre-pagination behavior"
          type: integer
          format: int32
          minimum: 0
        patterns:
          description: Detect candlestick patterns and include per-candle signals in response.
          type: boolean
        range:
          description: "Time range (default: 1mo)"
          $ref: "#/components/schemas/TimeRange"
        symbols:
          description: Comma-separated symbols (required)
          type: string
      required:
        - symbols
    BatchDividendsQuery:
      description: "Query parameters for `GET /v2/dividends`."
      type: object
      properties:
        cursor:
          description: "Opaque continuation cursor from a previous response's `pageInfo.endCursor`"
          type: string
        fields:
          description: Comma-separated list of fields to include in response
          type: string
        limit:
          description: "Max symbols per page; omitted (with cursor also omitted) = every requested\nsymbol's dividend history as a bare array, unchanged from pre-pagination behavior"
          type: integer
          format: int32
          minimum: 0
        range:
          description: "Time range (default: max)"
          $ref: "#/components/schemas/TimeRange"
        symbols:
          description: Comma-separated symbols (required)
          type: string
      required:
        - symbols
    BatchFinancialsQuery:
      description: "Query parameters for `GET /v2/financials`."
      type: object
      properties:
        fields:
          description: Comma-separated list of fields to include in response
          type: string
        frequency:
          description: "Frequency: annual or quarterly (default: annual)"
          $ref: "#/components/schemas/Frequency"
        metrics:
          description: "Comma-separated list of metric names to include in the statement (e.g. \"TotalRevenue,NetIncome\")"
          type: string
        statement:
          description: "Statement type (required): income, balance, cashflow"
          $ref: "#/components/schemas/StatementType"
        symbols:
          description: Comma-separated symbols (required)
          type: string
      required:
        - symbols
        - statement
    BatchIndicatorsQuery:
      description: "Query parameters for `GET /v2/indicators`."
      type: object
      properties:
        cursor:
          description: "Opaque continuation cursor from a previous response's `pageInfo.endCursor`"
          type: string
        fields:
          description: Comma-separated list of fields to include in response
          type: string
        interval:
          description: "Candle interval (default: 1d)"
          $ref: "#/components/schemas/Interval"
        limit:
          description: "Max symbols per page; omitted (with cursor also omitted) = every requested\nsymbol's indicators as a bare array, unchanged from pre-pagination behavior"
          type: integer
          format: int32
          minimum: 0
        range:
          description: "Time range (default: 1mo)"
          $ref: "#/components/schemas/TimeRange"
        symbols:
          description: Comma-separated symbols (required)
          type: string
      required:
        - symbols
    BatchOptionsQuery:
      description: "Query parameters for `GET /v2/options`."
      type: object
      properties:
        cursor:
          description: "Opaque continuation cursor from a previous response's `pageInfo.endCursor`"
          type: string
        date:
          description: "Expiration date (Unix timestamp, optional)"
          type: integer
          format: int64
        fields:
          description: Comma-separated list of fields to include in response
          type: string
        limit:
          description: "Max symbols per page; omitted (with cursor also omitted) = every requested\nsymbol's options chain as a bare array, unchanged from pre-pagination behavior"
          type: integer
          format: int32
          minimum: 0
        symbols:
          description: Comma-separated symbols (required)
          type: string
      required:
        - symbols
    BatchRecommendationsQuery:
      description: "Query parameters for `GET /v2/recommendations`."
      type: object
      properties:
        fields:
          description: Comma-separated list of fields to include in response
          type: string
        limit:
          description: Maximum number of similar symbols per requested symbol
          type: integer
          format: int32
          minimum: 0
        pageCursor:
          description: "Opaque continuation cursor from a previous response's `pageInfo.endCursor`"
          type: string
        pageLimit:
          description: "Max symbols per page; omitted (with page_cursor also omitted) = every\nrequested symbol's recommendations as a bare array, unchanged from\npre-pagination behavior"
          type: integer
          format: int32
          minimum: 0
        symbols:
          description: Comma-separated symbols (required)
          type: string
      required:
        - symbols
    BatchSplitsQuery:
      description: "Query parameters for `GET /v2/splits`."
      type: object
      properties:
        fields:
          description: Comma-separated list of fields to include in response
          type: string
        range:
          description: "Time range (default: max)"
          $ref: "#/components/schemas/TimeRange"
        symbols:
