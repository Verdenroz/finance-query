asyncapi: 3.0.0
info:
  title: Finance Query Streaming API
  version: 3.0.0
  description: High-performance financial data API server built on finance-query library
servers:
  financeQuery:
    host: finance-query.com
    protocol: wss
  localhost:
    host: "localhost:8000"
    protocol: ws
channels:
  v2FeedsStream:
    address: /v2/feeds/stream
    messages:
      FeedStreamCommand:
        $ref: "#/components/messages/FeedStreamCommand"
      GqlFeedEntry:
        $ref: "#/components/messages/GqlFeedEntry"
  v2Stream:
    address: /v2/stream
    messages:
      PriceStreamMessage:
        $ref: "#/components/messages/PriceStreamMessage"
      params_StreamCommand:
        $ref: "#/components/messages/params_StreamCommand"
operations:
  receiveFeedEntry:
    summary: Newly-seen RSS/Atom feed entries as the server polls each source.
    action: send
    channel:
      $ref: "#/channels/v2FeedsStream"
    messages:
      - $ref: "#/channels/v2FeedsStream/messages/GqlFeedEntry"
  receiveMessage:
    summary: "Real-time price ticks, or fired alert events while alert rules are active."
    action: send
    channel:
      $ref: "#/channels/v2Stream"
    messages:
      - $ref: "#/channels/v2Stream/messages/PriceStreamMessage"
  sendFeedMessage:
    summary: Subscribe/unsubscribe to feed sources.
    action: receive
    channel:
      $ref: "#/channels/v2FeedsStream"
    messages:
      - $ref: "#/channels/v2FeedsStream/messages/FeedStreamCommand"
  sendMessage:
    summary: "Subscribe/unsubscribe to symbols, or set alert rules."
    action: receive
    channel:
      $ref: "#/channels/v2Stream"
    messages:
      - $ref: "#/channels/v2Stream/messages/params_StreamCommand"
components:
  messages:
    FeedStreamCommand:
      payload:
        $ref: "#/components/schemas/FeedStreamCommand"
    GqlFeedEntry:
      payload:
        $ref: "#/components/schemas/GqlFeedEntry"
    PriceStreamMessage:
      payload:
        $ref: "#/components/schemas/PriceStreamMessage"
    params_StreamCommand:
      payload:
        $ref: "#/components/schemas/params_StreamCommand"
  schemas:
    AlertCondition:
      description: A predicate over incoming price ticks.
      oneOf:
        - type: object
          properties:
            crossesAbove:
              type: number
              format: double
          required:
            - crossesAbove
          additionalProperties: false
        - type: object
          properties:
            crossesBelow:
              type: number
              format: double
          required:
            - crossesBelow
          additionalProperties: false
        - type: object
          properties:
            priceAbove:
              type: number
              format: double
          required:
            - priceAbove
          additionalProperties: false
        - type: object
          properties:
            priceBelow:
              type: number
              format: double
          required:
            - priceBelow
          additionalProperties: false
        - type: object
          properties:
            percentChangeAbove:
              type: number
              format: double
          required:
            - percentChangeAbove
          additionalProperties: false
        - type: object
          properties:
            percentChangeBelow:
              type: number
              format: double
          required:
            - percentChangeBelow
          additionalProperties: false
        - type: object
          properties:
            volumeAbove:
              type: integer
              format: int64
          required:
            - volumeAbove
          additionalProperties: false
    AlertConditionKind:
      description: "Which predicate an [`AlertCondition`] applies, without its threshold."
      type: string
      enum:
        - crossesAbove
        - crossesBelow
        - priceAbove
        - priceBelow
        - percentChangeAbove
        - percentChangeBelow
        - volumeAbove
    AlertEvent:
      description: "A fired alert, carrying the tick that triggered it."
      type: object
      properties:
        changePercent:
          description: Percent change carried by the triggering tick.
          type: number
          format: float
        condition:
          description: Condition that fired.
          $ref: "#/components/schemas/AlertCondition"
        previousPrice:
          description: "Last price seen before this tick, if any."
          type: number
          format: float
        price:
          description: Price on the triggering tick.
          type: number
          format: float
        symbol:
          description: Symbol that triggered.
          type: string
        time:
          description: Tick timestamp (milliseconds).
          type: integer
          format: int64
        update:
          description: The full triggering tick.
          $ref: "#/components/schemas/PriceUpdate"
      required:
        - symbol
        - condition
        - price
        - changePercent
        - time
        - update
    FeedStreamCommand:
      description: "Inbound control message for `/v2/feeds/stream`."
      type: object
      properties:
        formType:
          description: "SEC filing form type, used when `sec-filings` is in `subscribe`."
          type: string
        subscribe:
          description: "Feed source slugs to subscribe to (same slugs as `GET /v2/feeds`'s\n`sources` param)."
          type: array
          items:
            type: string
        unsubscribe:
          description: Feed source slugs to unsubscribe from.
          type: array
          items:
            type: string
    GqlFeedEntry:
      description: A single entry from an RSS/Atom feed.
      type: object
      properties:
        published:
          type: string
        source:
          type: string
        summary:
          type: string
        title:
          type: string
        url:
          type: string
      required:
        - title
        - url
        - source
    MarketHoursType:
      description: Market hours type enumeration
      type: string
      enum:
        - PRE_MARKET
        - REGULAR_MARKET
        - POST_MARKET
        - EXTENDED_HOURS_MARKET
    OptionType:
      description: Option type enumeration
      type: string
      enum:
        - CALL
        - PUT
    PriceStreamMessage:
      description: "Outbound message on `/v2/stream`: a live price tick, or — while a\nclient's alert rules are active — a fired alert event instead of the raw\ntick. Schema-only: `deliver()` in `handlers::stream` sends each variant's\nJSON directly rather than constructing this type."
      oneOf:
        - $ref: "#/components/schemas/PriceUpdate"
        - $ref: "#/components/schemas/AlertEvent"
    PriceUpdate:
      description: Real-time price update from Yahoo Finance WebSocket.
      type: object
      properties:
        ask:
          type: number
          format: float
        askSize:
          type: integer
          format: int64
        bid:
          type: number
          format: float
        bidSize:
          type: integer
          format: int64
        change:
          type: number
          format: float
        changePercent:
          type: number
          format: float
        circulatingSupply:
          type: number
          format: double
        currency:
          type: string
        dayHigh:
          type: number
          format: float
        dayLow:
          type: number
          format: float
        dayVolume:
          type: integer
          format: int64
        exchange:
          type: string
        expireDate:
          type: integer
          format: int64
        fromCurrency:
          type: string
        id:
          type: string
        lastMarket:
          type: string
        lastSize:
          type: integer
          format: int64
        marketCap:
          type: number
          format: double
        marketHours:
          $ref: "#/components/schemas/MarketHoursType"
        miniOption:
          type: integer
          format: int64
        openInterest:
          type: integer
          format: int64
        openPrice:
          type: number
          format: float
        optionsType:
          $ref: "#/components/schemas/OptionType"
        previousClose:
          type: number
          format: float
        price:
          type: number
          format: float
        priceHint:
          type: integer
          format: int64
        quoteType:
          $ref: "#/components/schemas/pricing_QuoteType"
        shortName:
          type: string
        strikePrice:
          type: number
          format: float
        time:
          type: integer
          format: int64
        underlyingSymbol:
          type: string
        vol24hr:
          type: integer
          format: int64
        volAllCurrencies:
          type: integer
          format: int64
      required:
        - id
        - price
        - time
        - currency
        - exchange
        - quoteType
        - marketHours
        - changePercent
        - dayVolume
        - dayHigh
        - dayLow
        - change
        - shortName
        - expireDate
        - openPrice
        - previousClose
        - strikePrice
        - underlyingSymbol
        - openInterest
        - optionsType
        - miniOption
        - lastSize
        - bid
        - bidSize
        - ask
        - askSize
        - priceHint
        - vol24hr
        - volAllCurrencies
        - fromCurrency
        - lastMarket
        - circulatingSupply
        - marketCap
    WsAlertRule:
      description: One alert rule as sent over the wire.
      type: object
      properties:
        condition:
          description: "Predicate to evaluate. Crossing conditions compare against the\nprevious tick and never fire on a symbol's first tick."
          $ref: "#/components/schemas/AlertConditionKind"
        repeat:
          description: "Fire every time the condition becomes true again, instead of once."
          type: boolean
        symbol:
          description: Ticker symbol to watch.
          type: string
        value:
          description: Threshold the predicate compares against.
          type: number
          format: double
      required:
        - symbol
        - condition
        - value
    params_StreamCommand:
      description: "Inbound control message for `/v2/stream`."
      type: object
      properties:
        alerts:
          description: "Replace the connection's alert rule set. While a non-empty rule set is\nactive the server sends alert events instead of raw price updates;\nsend an empty array to revert to raw ticks. Symbols named by rules\nare subscribed automatically."
          type: array
          items:
            $ref: "#/components/schemas/WsAlertRule"
        subscribe:
          description: Ticker symbols to subscribe to.
          type: array
          items:
            type: string
        unsubscribe:
          description: Ticker symbols to unsubscribe from.
          type: array
          items:
            type: string
    pricing_QuoteType:
      description: Quote type enumeration
      type: string
      enum:
        - NONE
        - ALT_SYMBOL
        - HEARTBEAT
        - EQUITY
        - INDEX
        - MUTUAL_FUND
        - MONEY_MARKET
        - OPTION
        - CURRENCY
        - WARRANT
        - BOND
        - FUTURE
        - ETF
        - COMMODITY
        - ECN_QUOTE
        - CRYPTOCURRENCY
        - INDICATOR
        - INDUSTRY
