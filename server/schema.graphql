"""
type GqlTicker {
	symbol: String!
	quote(		logo: Boolean! = false,		format: GqlValueFormat! = RAW,
		"""
		Target language for translated text fields (BCP 47)
		"""
		lang: String
	): GqlQuote!
	chart(		interval: GqlInterval! = ONE_DAY,		range: GqlTimeRange! = ONE_MONTH,
		"""
		Start date as Unix timestamp (seconds). When provided, overrides `range`.
		"""
		start: Int,
		"""
		End date as Unix timestamp (seconds). Defaults to now when `start` is set.
		"""
		end: Int,		events: Boolean! = false,		patterns: Boolean! = false
	): GqlChart!
	news(
		"""
		Overall cap on articles fetched
		"""
		count: Int! = 10,
		"""
		Target language for translated text fields (BCP 47)
		"""
		lang: String,
		"""
		Max entries per page; omitted = every fetched article (up to `count`) in one page
		"""
		first: Int,
		"""
		Opaque continuation cursor from a previous page's endCursor
		"""
		after: String
	): GqlNewsConnection!
	"""
	This company's own press releases, distinct from `news` (press
	coverage). Routes through EDGAR 8-K exhibits, falling back to
	FMP/Alpha Vantage when configured.
	"""
	pressReleases(
		"""
		Maximum number of releases to return
