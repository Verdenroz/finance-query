# Site configuration for `cargo soothfast docs build|serve`.

[site]
name = "finance-query"
version = "3.2.0"
repo = "https://github.com/Verdenroz/finance-query"
logo = "assets/logo.png"
favicon = "assets/logo.png"

[site.theme]
primary = "#CB6015"
secondary = "#6E5B4A"
