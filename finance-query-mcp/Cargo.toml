[package]
name = "finance-query-mcp"
version = "3.0.0"
edition = "2024"
description = "MCP server exposing finance-query tools to AI agents"
license = "MIT"
repository = "https://github.com/Verdenroz/finance-query"
publish = false

[lib]
name = "finance_query_mcp"
path = "src/lib.rs"

[[bin]]
name = "fq-mcp"
path = "src/main.rs"

[dependencies]
finance-query = { path = "..", features = [
    "indicators",
    "fred",
    "crypto",
    "risk",
    "translation",
    "sentiment",
] }
finance-query-server = { path = "../server", default-features = false, features = [
    "translation",
] }

# GraphQL (for in-process schema execution)
async-graphql = "7"

# MCP SDK (official Rust MCP SDK from modelcontextprotocol/rust-sdk)
rmcp = { version = "1", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "transport-io",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Error handling
anyhow = "1"

# Metrics (same versions as server/Cargo.toml)
prometheus = "0.14"
lazy_static = "1.5"

# CLI argument parsing (transport flag)
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment config
dotenvy = "0.15"
axum = "0.8"

[dev-dependencies]
# Route/spec reconciliation (`cargo soothfast spec check`). Dev-only — never
# compiled into the production binary (this crate isn't published anyway).
soothfast = { version = "0.1", features = ["runner"] }

[[bench]]
name = "soothfast-routes"
path = "spec/routes.rs"
harness = false

[features]
default = []
# Dictionary-tier translation for the `lang` tool param.
translation = ["finance-query/translation", "finance-query-server/translation"]
# Local opus-mt models via CTranslate2 — requires cmake + a C++ toolchain to
# build. Without it, translation falls back to the built-in dictionary.
translation-offline = [
    "translation",
    "finance-query/translation-offline",
    "finance-query-server/translation-offline",
]
# Backtesting engine for the `run_backtest` tool (prebuilt strategies only).
backtesting = ["finance-query/backtesting"]
# Every feature except `translation-offline` (see root Cargo.toml's `full` for why).
full = ["backtesting", "translation"]
