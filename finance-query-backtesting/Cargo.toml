[package]
name = "finance-query-backtesting"
version = "3.4.0"
edition = "2024"
authors = ["Harvey Tseng <harveytseng2@gmail.com>"]
description = "Backtesting engine for the finance-query library"
license = "MIT"
repository = "https://github.com/Verdenroz/finance-query"
homepage = "https://github.com/Verdenroz/finance-query"
documentation = "https://docs.rs/finance-query-backtesting"
keywords = ["finance", "backtesting", "trading", "strategy"]
categories = ["finance"]

[dependencies]
finance-query-types = { version = "3.4.0", path = "../finance-query-types", features = ["indicators"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1"
tracing = "0.1"
polars = { version = "0.55.2", optional = true, default-features = false, features = ["lazy", "polars-ops", "fmt", "dtype-datetime", "dtype-date", "timezones"] }

[features]
default = []
dataframe = ["dep:polars", "finance-query-types/dataframe"]

[dev-dependencies]
finance-query = { path = "..", features = ["full"] }

[package.metadata.docs.rs]
all-features = true
