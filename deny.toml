# cargo-deny configuration — supply-chain policy for the workspace.
# Run locally with: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Evaluate the full dependency graph across all feature flags.
all-features = true

[advisories]
# Fail on any crate with a known security advisory or that has been yanked.
yanked = "deny"
# Add advisory IDs here (with a justification) only to consciously accept a risk.
# Gating a feature does not silence an advisory: `cargo audit` reads Cargo.lock
# and `all-features` is on, so only dropping the optional dep clears an entry.
ignore = [
    # `paste` is unmaintained (not vulnerable). Compile-time-only proc-macro
    # pulled in via ct2rs -> tokenizers -> macro_rules_attribute for the
    # optional `translation-offline` feature; no fixed upstream release exists.
    # Revisit when tokenizers migrates off paste.
    "RUSTSEC-2024-0436",
    # `chrono` and `chrono-tz` are unmaintained (not vulnerable), with no
    # fixed release. Both are direct dependencies and polars-arrow pulls them
    # in too, so only a migration to jiff or time plus a polars release
    # clears these. Revisit when polars moves off chrono.
    "RUSTSEC-2026-0543",
    "RUSTSEC-2026-0555",
    # `quick-xml` 0.39 (two DoS advisories, fixed in 0.41) and `humantime`
    # (unmaintained) come in through object_store 0.13, which polars-error
    # 0.55 pins; only object_store 0.14 has the fix. finance-query never uses
    # polars' cloud I/O, so object_store never parses XML here. Revisit when
    # polars moves to object_store 0.14.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0542",
    # `bincode` is unmaintained (not vulnerable), with no fixed release;
    # polars-utils 0.55 depends on it. Revisit at the next polars release.
    "RUSTSEC-2025-0141",
]

[bans]
# Duplicate versions bloat the tree and widen the attack surface; warn for now.
multiple-versions = "warn"
# Wildcard ("*") version requirements are a supply-chain risk — disallow them.
wildcards = "deny"
allow-wildcard-paths = true
# Explicitly banned crates go here, e.g. { crate = "openssl", reason = "..." }.
deny = []

[licenses]
# Allow-list of licenses acceptable for an MIT-licensed project.
# A dependency whose license is not listed here fails the check.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Keep a forward-looking allow-list without warning about not-yet-used entries.
unused-allowed-license = "allow"
# Per-crate license exceptions go here when a crate needs a license not in `allow`.
exceptions = []

[sources]
# Only allow crates from the official crates.io registry; reject unknown
# registries and git sources
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
