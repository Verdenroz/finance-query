name: Gate Diagnostic

# Temporary A/A control: gates a comment-only change against HEAD~1 with the
# same runner on both sides, so any reported delta is a false positive.
# Delete once the gate is confirmed stable.

on:
  push:
    branches: [diag/aa-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aa:
    name: A/A gate control
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: bench-gate
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Install cargo-soothfast
        run: |
          RUNNER=$(grep -A1 '^name = "soothfast"$' Cargo.lock | grep '^version' | cut -d'"' -f2)
          echo "locked runner: $RUNNER"
          cargo install cargo-soothfast --locked --version "$RUNNER"
      - name: Gate a comment-only change against HEAD~1
        run: cargo soothfast gate -p finance-query --features bench-gate --against-ref HEAD~1
