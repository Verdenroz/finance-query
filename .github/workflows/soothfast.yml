name: Soothfast

# Perf gate + living docs, spec reconciliation, and site build.

# No paths filter: a skipped job satisfies required checks, but a workflow
# that never triggers blocks the merge.
on:
  pull_request:
  # Master runs warm the job-scoped caches PR refs restore but can't save to.
  push:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

concurrency:
  group: soothfast-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Soothfast Changes
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    outputs:
      soothfast: ${{ steps.filter.outputs.soothfast }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            soothfast:
              - 'src/**'
              - 'proto/**'
              - 'benches/**'
              - 'docs/**'
              - 'README.md'
              - 'soothfast.lock'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/soothfast.yml'
              - 'server/src/**'
              - 'server/benches/**'
              - 'server/openapi.yaml'
              - 'server/asyncapi.yaml'
              - 'server/schema.graphql'
              - 'server/soothfast.toml'
              - 'sdks/**'
              - 'finance-query-mcp/src/**'
              - 'finance-query-mcp/benches/**'
              - 'finance-query-mcp/mcp-tools.json'

  gate:
    name: Gate
    needs: changes
    if: always() && github.event_name == 'pull_request' && needs.changes.outputs.soothfast == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history: the merge-base must be checkoutable into the worktree.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: bench-gate
          # A failing measured run must not cost the retry its warm cache.
          cache-on-failure: true
      - name: Install valgrind
        # Fallback: CI VMs often lack a PMU, so auto falls back to callgrind.
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Install cargo-soothfast
        uses: Verdenroz/soothfast@bd5c2604e8923a376c6ee6f8bedcd2ae89f0f8ad # v0.1.19
      # Unique per commit with the prefix in restore-keys: an exact key is
      # never rewritten once saved, so later commits would all miss.
      - name: Restore measured reference runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .soothfast/runs
          key: soothfast-runs-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            soothfast-runs-${{ github.ref_name }}-
            soothfast-runs-
      - name: Gate against merge-base
        run: |
          set -euo pipefail
          base_sha="$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)"
          # Gate only if the merge-base has the bench, so the PR that adds
          # it still measures instead of failing on a nonexistent target.
          if git cat-file -e "${base_sha}:benches/soothfast.rs" 2>/dev/null; then
            cargo soothfast gate -p finance-query --features bench-gate \
              --against-ref "${{ github.event.pull_request.base.sha }}"
          else
            echo "Merge-base has no soothfast bench yet — measuring head without gating."
            cargo soothfast measure -p finance-query --features bench-gate
          fi
      - name: Upload triage artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soothfast-triage
          path: .soothfast/triage/
          if-no-files-found: ignore

  baseline:
    name: Baseline
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.soothfast == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: bench-gate
          # A failing measured run must not cost the retry its warm cache.
          cache-on-failure: true
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Install cargo-soothfast
        uses: Verdenroz/soothfast@bd5c2604e8923a376c6ee6f8bedcd2ae89f0f8ad # v0.1.19
      # Same key as deploy.yml so master deploys seed PR restores;
      # identical benchmarked code measures identically
      - name: Restore measured baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .soothfast/baselines/base.json
          key: soothfast-baseline-${{ hashFiles('src/**', 'benches/**', 'Cargo.toml', 'Cargo.lock', 'finance-query-derive/**') }}
      - name: Measure baseline
        run: |
          if [ ! -f .soothfast/baselines/base.json ]; then
            cargo soothfast measure -p finance-query --features bench-gate --save-baseline base
          fi
      - name: Upload baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soothfast-baseline
          path: .soothfast/baselines/base.json
          if-no-files-found: error

  docs-binds:
    name: Docs binds & coverage
    runs-on: ubuntu-latest
    needs: baseline
    # Result-based: needs.changes is skipped on push, which would otherwise
    # cascade past baseline's always() and starve the master cache warm.
    if: always() && needs.baseline.result == 'success'
    env:
      SOOTHFAST_BENCH_TOOLCHAIN: nightly
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history: `docs diff` builds the base ref's surface in a worktree.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: docs-binds
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install cargo-soothfast
        uses: Verdenroz/soothfast@bd5c2604e8923a376c6ee6f8bedcd2ae89f0f8ad # v0.1.19
      - name: Download measured baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soothfast-baseline
          path: .soothfast/baselines
      - name: Check binds, claims, and generated doc tests
        run: |
          cargo soothfast docs check -p finance-query --features full --baseline base \
            docs/library README.md
      - name: Public API doc coverage (ratchet — currently 99%)
        run: cargo soothfast coverage docs -p finance-query --features full --min 95
      - name: Public API surface diff vs PR base
        if: github.event_name == 'pull_request'
        # Informational only (exits 0 regardless of diff content)
        run: |
          cargo soothfast docs diff -p finance-query --features full \
            --against-ref "${{ github.event.pull_request.base.sha }}"

  spec-server:
    name: Spec & SDK (server)
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.soothfast == 'true')
    runs-on: ubuntu-latest
    env:
      SOOTHFAST_BENCH_TOOLCHAIN: nightly
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: spec
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install cargo-soothfast
        uses: Verdenroz/soothfast@bd5c2604e8923a376c6ee6f8bedcd2ae89f0f8ad # v0.1.19
      - name: Reconcile OpenAPI/AsyncAPI/GraphQL routes against handlers
        run: cargo soothfast spec check -p finance-query-server --target soothfast-routes
      - name: Generated openapi.yaml/asyncapi.yaml are fresh
        run: cargo soothfast spec gen -p finance-query-server --target soothfast-routes --check
      - name: Generated Python SDK is fresh
        run: cargo soothfast sdk gen -p finance-query-server --target soothfast-routes --check
      - name: Spec compat gate vs merge-base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}:server/spec/routes.rs" 2>/dev/null; then
            cargo soothfast spec gate -p finance-query-server --target soothfast-routes \
              --base "$BASE_SHA" --from-committed
          else
            echo "Merge-base has no soothfast-routes bench yet — nothing to gate against."
          fi
      - name: Regenerate server route pages
        run: make docs-pages PAGES=server
      - name: Upload server route pages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-pages-server
          path: docs/server
          if-no-files-found: error

  spec-mcp:
    name: Spec (MCP)
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.soothfast == 'true')
    runs-on: ubuntu-latest
    env:
      SOOTHFAST_BENCH_TOOLCHAIN: nightly
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: spec
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install cargo-soothfast
        uses: Verdenroz/soothfast@bd5c2604e8923a376c6ee6f8bedcd2ae89f0f8ad # v0.1.19
      - name: Reconcile MCP tool routes against mcp-tools.json
        run: cargo soothfast spec check -p finance-query-mcp --target soothfast-routes --features backtesting
      - name: Generated mcp-tools.json is fresh
        run: cargo soothfast spec gen -p finance-query-mcp --target soothfast-routes --check --features backtesting
      - name: Regenerate MCP route pages
        run: make docs-pages PAGES=mcp
      - name: Upload MCP route pages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-pages-mcp
          path: docs/server
          if-no-files-found: error

  proto-check:
    name: Proto reconciliation
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.soothfast == 'true')
    runs-on: ubuntu-latest
    env:
      SOOTHFAST_BENCH_TOOLCHAIN: nightly
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: spec
          # near-empty target; saving would poison the shared spec key
          save-if: false
      - name: Install cargo-soothfast
        uses: Verdenroz/soothfast@bd5c2604e8923a376c6ee6f8bedcd2ae89f0f8ad # v0.1.19
      - name: Reconcile pricing.proto against PricingData
        run: |
          cargo soothfast spec check-proto -p finance-query --proto proto/pricing.proto \
            --message PricingData --source src/streaming/pricing.rs --struct PricingData

  docs-lib:
    name: Docs pages (lib)
    runs-on: ubuntu-latest
    needs: baseline
    if: always() && needs.baseline.result == 'success'
    env:
      SOOTHFAST_BENCH_TOOLCHAIN: nightly
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: docs-binds
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install cargo-soothfast
        uses: Verdenroz/soothfast@bd5c2604e8923a376c6ee6f8bedcd2ae89f0f8ad # v0.1.19
      - name: Download measured baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soothfast-baseline
          path: .soothfast/baselines
      - name: Regenerate library docs pages
        run: make docs-pages PAGES=lib
      - name: Upload library docs pages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-pages-lib
          path: |
            docs/reference
            docs/perf
            docs/coverage.md
            docs/llms.txt
            llms.txt
          if-no-files-found: error

  site-build:
    name: Docs site build
    runs-on: ubuntu-latest
    needs: [baseline, docs-lib, spec-server, spec-mcp]
    if: always() && needs.baseline.result == 'success' && needs.docs-lib.result == 'success' && needs.spec-server.result == 'success' && needs.spec-mcp.result == 'success'
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install nightly (rustdoc JSON)
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install cargo-soothfast
        uses: Verdenroz/soothfast@bd5c2604e8923a376c6ee6f8bedcd2ae89f0f8ad # v0.1.19
      - name: Download measured baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soothfast-baseline
          path: .soothfast/baselines
      - name: Download generated route pages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docs-pages-*
          merge-multiple: true
          path: docs/server
      - name: Download library docs pages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-pages-lib
      - name: Docs site builds cleanly
        # Static build only (not gh-deploy)
        run: cargo soothfast docs build --baseline base --out target/site-check
