name: soothfast

# Written by `cargo soothfast init`; `cargo soothfast init --check` reports drift.
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

# Only a pull request's newer push supersedes a run; a push run records the
# reference the next pull request reuses and must finish.
concurrency:
  group: soothfast-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  soothfast:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: Verdenroz/soothfast/.github/workflows/run.yml@4c2f029b6370aab45334427a1badcbf28fdca9c6
    with:
      soothfast_ref: "4c2f029b6370aab45334427a1badcbf28fdca9c6"
      bot: true
