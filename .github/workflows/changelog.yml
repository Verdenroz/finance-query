name: Changelog

# Runs on merge to master, not on every PR push.

on:
  push:
    branches: [master]

permissions: {}

jobs:
  changelog:
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    permissions: {} # all repo access comes from the minted App token below
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Mint a changelog-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CHANGELOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Get soothfast-bot user id
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0 # surface diff + previous-tag lookup need history
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install nightly (rustdoc JSON for the surface diff)
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install cargo-binstall
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-binstall
      - name: Install cargo-soothfast
        # rust-cache can restore binstall's install record without the
        # binary itself; --force reinstalls past the stale record.
        run: |
          command -v cargo-soothfast >/dev/null || FORCE=--force
          cargo binstall cargo-soothfast --locked --no-confirm ${FORCE:-}
      # No bench on the reference side means no deterministic diff, so the
      # perf table would fall back to a snapshot that jitters every push.
      - name: Check the previous tag has a bench to compare against
        id: prev
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "ref=$PREV" >> "$GITHUB_OUTPUT"
          if git cat-file -e "$PREV:benches/soothfast.rs" 2>/dev/null; then
            echo "comparable=true" >> "$GITHUB_OUTPUT"
          else
            echo "comparable=false" >> "$GITHUB_OUTPUT"
            echo "$PREV predates benches/soothfast.rs — skipping until the next release tag."
          fi
      - name: Measure baseline for claims
        if: steps.prev.outputs.comparable == 'true'
        run: cargo soothfast measure -p finance-query --features bench-gate --save-baseline base
      - name: Regenerate CHANGELOG.md
        if: steps.prev.outputs.comparable == 'true'
        env:
          PREV: ${{ steps.prev.outputs.ref }}
        run: |
          cargo soothfast report changelog -p finance-query --baseline base \
            --against-ref "$PREV" --features full
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: cpr
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: CHANGELOG.md
          commit-message: "docs: regenerate CHANGELOG.md"
          title: "docs: regenerate CHANGELOG.md"
          body: Automated CHANGELOG regeneration.
          branch: bot/changelog-update
          delete-branch: true
          author: >-
            ${{ steps.app-token.outputs.app-slug }}[bot]
            <${{ steps.app-user.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
      - name: Merge pull request
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge --auto --squash --delete-branch "$PR_NUMBER"
