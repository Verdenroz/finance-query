# Temporary: records the reviewed PR #409 gate deltas into soothfast-gate.lock
# from CI's own callgrind measurement, then uploads the lock for committing.
# Delete this workflow once the lock lands on the branch.
name: Gate Accept (one-off)

on:
  push:
    branches: [feat/backtesting-margin-sizing-pareto]

permissions:
  contents: read

jobs:
  gate-accept:
    name: Gate Accept
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: bench-gate
          cache-on-failure: true
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Install cargo-soothfast
        uses: Verdenroz/soothfast@bd5c2604e8923a376c6ee6f8bedcd2ae89f0f8ad # v0.1.19
      - name: Accept reviewed deltas
        run: |
          set -euo pipefail
          cargo soothfast gate accept -p finance-query \
            --against-ref origin/master \
            --justification "margin/leverage/sizing feature plus 33 audited correctness fixes changed measured work by design; deltas bisected and reviewed in PR #409"
          cat soothfast-gate.lock
      - name: Upload lock file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soothfast-gate-lock
          path: soothfast-gate.lock
