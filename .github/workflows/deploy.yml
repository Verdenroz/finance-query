name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: V2 (Rust)
            context: .
            file: server/Dockerfile
            suffix: v2
            # translation-offline disabled temporarily
            build-args: CARGO_FEATURES=translation
          - name: V1 (Python)
            context: v1
            file: v1/Dockerfile
            suffix: v1
            build-args: ""
          - name: MCP
            context: .
            file: finance-query-mcp/Dockerfile
            suffix: mcp
            # translation-offline disabled temporarily
            build-args: CARGO_FEATURES=translation

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name to lowercase
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image.name }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          build-args: ${{ matrix.image.build-args }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image.suffix }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image.suffix }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.suffix }}

  deploy-docs:
    name: Deploy docs site to GitHub Pages
    runs-on: ubuntu-latest
    # Rapid merges would each branch trend.jsonl off their own checkout,
    # and the second trend PR would conflict on master and hang.
    concurrency:
      group: deploy-docs
    environment: soothfast-bot
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout soothfast-bot scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Verdenroz/soothfast
          ref: 80b18d8831521646b65fec79c6df14d6f763c602 # v0.3.1
          path: soothfast-action
          sparse-checkout: action
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install nightly (rustdoc JSON for the docs engine)
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # A failing gate must not lose the warm state the retry would reuse.
          cache-on-failure: true
      - name: Install valgrind
        # Fallback backend when the CI VM exposes no PMU.
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Install cargo-soothfast
        uses: Verdenroz/soothfast@80b18d8831521646b65fec79c6df14d6f763c602 # v0.3.1
        with:
          gate: false
          changelog: false

      # No-code commits still reach master (soothfast.yml's paths filter and
      # [bot] exclusion don't apply here); gating them would only add noise.
      - name: Detect benchmarkable changes
        id: bench_changes
        run: |
          if git diff --quiet HEAD~1 HEAD -- src benches Cargo.toml Cargo.lock finance-query-derive; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No benchmarked code changed since HEAD~1 — skipping the perf gate."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Identical benchmarked code measures identically, so a hit here lets
      # the measure step below skip via its [ ! -f ] guard.
      - name: Restore measured baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .soothfast/baselines/base.json
          key: soothfast-baseline-${{ hashFiles('src/**', 'benches/**', 'Cargo.toml', 'Cargo.lock', 'finance-query-derive/**') }}

      # Unique per commit with the prefix in restore-keys: an exact key is
      # never rewritten once saved, so later commits would all miss.
      - name: Restore measured reference runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .soothfast/runs
          key: soothfast-runs-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            soothfast-runs-${{ github.ref_name }}-
            soothfast-runs-

      # Writes gate-status.json, which `report render` colors the badge from.
      # HEAD~1 is well-defined here since master is linear.
      - name: Gate against previous commit
        if: steps.bench_changes.outputs.changed == 'true'
        continue-on-error: true
        run: |
          cargo soothfast gate -p finance-query --features bench-gate \
            --against-ref HEAD~1 --save-baseline base

      # A passing gate already saved the baseline; measure fills in when the
      # gate was skipped or failed, so docs regen never runs without one.
      - name: Measure baseline for claims
        run: |
          if [ ! -f .soothfast/baselines/base.json ]; then
            cargo soothfast measure -p finance-query --features bench-gate --save-baseline base
          fi

      - name: Append performance trend point
        if: steps.bench_changes.outputs.changed == 'true'
        run: |
          git fetch origin master
          git checkout origin/master -- .soothfast/trend.jsonl
          cargo soothfast trend append -p finance-query --from-baseline base

      - name: Regenerate endpoint reference pages
        # A bare `wait` after backgrounding both would mask their exit codes.
        run: |
          cargo soothfast docs routes -p finance-query-server --target soothfast-routes --out docs/server &
          server=$!
          cargo soothfast docs routes -p finance-query-mcp --target soothfast-routes --out docs/server &
          mcp=$!
          status=0
          wait "$server" || status=1
          wait "$mcp" || status=1
          [ "$status" -eq 0 ] || exit "$status"
          cargo soothfast spec html -p finance-query-server --target soothfast-routes --out docs/server/api
          cargo soothfast spec html -p finance-query-mcp --target soothfast-routes --out docs/server/api

      - name: Regenerate API reference, perf report, coverage page, and llms.txt
        run: |
          cargo soothfast docs reference -p finance-query --baseline base --features full --out docs/reference
          cargo soothfast report render -p finance-query --baseline base --features full --out docs/perf
          mv docs/perf/llms.txt docs/llms.txt
          cp docs/llms.txt llms.txt
          { echo "# Coverage"; echo; \
            echo "> Generated by \`cargo soothfast coverage docs\`."; echo; \
            echo '```text'; \
            cargo soothfast coverage docs -p finance-query --features full \
              --badge docs/perf/badges/coverage.json --badge docs/perf/badges/coverage.svg; \
            echo '```'; } > docs/coverage.md

      - name: Regenerate captured doc output
        # dataframe.md/finance.md/ticker.md/tickers.md excluded: they capture
        # live Yahoo data (real prices/timestamps).
        run: |
          cargo soothfast docs capture -p finance-query --features full \
            docs/library/backtesting.md docs/library/commodities.md \
            docs/library/configuration.md docs/library/crypto.md docs/library/economic.md \
            docs/library/error-handling.md docs/library/feeds.md docs/library/filings.md \
            docs/library/forex.md docs/library/futures.md docs/library/getting-started.md \
            docs/library/indicators.md docs/library/indices.md docs/library/providers/alphavantage.md \
            docs/library/providers/coingecko.md docs/library/providers/edgar.md \
            docs/library/providers/fmp.md docs/library/providers/fred.md docs/library/providers/index.md \
            docs/library/providers/polygon.md docs/library/risk.md docs/library/screeners.md \
            docs/library/streaming.md docs/library/translation.md README.md

      - name: Keep llms.txt only when the documented surface moved
        # Measured lines change every run; committing them would make this
        # job re-trigger itself off its own merges forever
        run: |
          if git diff --quiet -- llms.txt; then exit 0; fi
          mkdir -p target/llms-churn
          sed '/^\*\*Measured:\*\*/d' llms.txt > target/llms-churn/new.txt
          git show HEAD:llms.txt | sed '/^\*\*Measured:\*\*/d' > target/llms-churn/old.txt
          cmp -s target/llms-churn/old.txt target/llms-churn/new.txt && git checkout -- llms.txt || true

      # Minted after every step that compiles the tree has run.
      - name: Mint a soothfast-bot token
        id: bot
        run: soothfast-action/action/bot-token.sh
      - name: Build and publish docs site
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          APP_SLUG: ${{ steps.bot.outputs.app_slug }}
        run: |
          id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git config credential.helper '!f() { echo "username=x-access-token"; echo "password=$GH_TOKEN"; }; f'
          cargo soothfast docs gh-deploy --baseline base
      # Direct pushes to master are blocked by the branch ruleset, so the bot
      # opens a PR and squash-merges it itself instead.
      - name: Land the regenerated artifacts
        env:
          TOKEN: ${{ steps.bot.outputs.token }}
          APP_SLUG: ${{ steps.bot.outputs.app_slug }}
          BRANCH: bot/derived-artifacts
          TITLE: "chore: regenerate derived artifacts"
          BODY: Automated trend, captured-output, and llms.txt regeneration.
          PATHS: .soothfast/trend.jsonl llms.txt docs/library README.md
        run: soothfast-action/action/land.sh
      - name: Revoke the soothfast-bot token
        if: always() && steps.bot.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: gh api -X DELETE /installation/token || true

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions: {}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Deploy via SSH
        uses: appleboy/ssh-action@823bd89e131d8d508129f9443cad5855e9ba96f0 # v1.2.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/finance-query
            set -a; . ./.env 2>/dev/null || true; set +a
            IMAGE_BASE="ghcr.io/${GITHUB_REPO:-verdenroz/finance-query}"
            PREV_SHA=$(git rev-parse HEAD)

            check_health() {
              curl -f http://localhost/v2/health \
                && curl -f http://localhost/v1/health \
                && curl -f http://localhost/mcp/health
            }

            # Pins the checkout to the deployed commit, so an out-of-band
            # sync can't leave docker-compose.prod.yml stale.
            git fetch origin master
            git checkout --force ${{ github.sha }}

            # docker-compose.prod.yml is an overlay on docker-compose.yml
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            # Verify deployment; roll back to the previous SHA's images on failure.
            sleep 10
            if ! check_health; then
              echo "Health check failed for ${{ github.sha }}, rolling back to $PREV_SHA"
              git checkout --force "$PREV_SHA"
              for svc in v2 v1 mcp; do
                docker pull "$IMAGE_BASE/$svc:$PREV_SHA"
                docker tag "$IMAGE_BASE/$svc:$PREV_SHA" "$IMAGE_BASE/$svc:latest"
              done
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
              sleep 10
              check_health
              exit 1
            fi

            docker image prune -f
