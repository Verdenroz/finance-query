name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build ${{ matrix.image.name }}
    # Not a blanket [bot] test: dependabot's base-image bumps must still rebuild.
    # The bot also merges labelled PRs, so skip by commit author, not actor.
    if: github.event.head_commit.author.name != 'soothfast-bot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: V2 (Rust)
            context: .
            file: server/Dockerfile
            suffix: v2
            no-cache-filters: runtime
            # translation-offline disabled temporarily
            build-args: CARGO_FEATURES=translation
          - name: V1 (Python)
            context: v1
            file: v1/Dockerfile
            suffix: v1
            no-cache-filters: ""
            build-args: ""
          - name: MCP
            context: .
            file: finance-query-mcp/Dockerfile
            suffix: mcp
            no-cache-filters: runtime
            # translation-offline disabled temporarily
            build-args: CARGO_FEATURES=translation,backtesting

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name to lowercase
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          build-args: ${{ matrix.image.build-args }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image.suffix }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image.suffix }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.suffix }}
          no-cache-filters: ${{ matrix.image.no-cache-filters }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.suffix }}

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions: {}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/finance-query
            set -a; . ./.env 2>/dev/null || true; set +a
            IMAGE_BASE="ghcr.io/${GITHUB_REPO:-verdenroz/finance-query}"
            PREV_SHA=$(git rev-parse HEAD)

            check_health() {
              curl -f http://localhost/v2/health \
                && curl -f http://localhost/v1/health \
                && curl -f http://localhost/mcp/health
            }

            # Pins the checkout to the deployed commit, so an out-of-band
            # sync can't leave docker-compose.prod.yml stale.
            git fetch origin master
            git checkout --force ${{ github.sha }}

            # docker-compose.prod.yml is an overlay on docker-compose.yml
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            # up -d ignores bind-mount content changes, and caddy reload would
            # skip the password substitution the entrypoint does at start.
            git diff --quiet "$PREV_SHA" ${{ github.sha }} -- Caddyfile || CADDY_CHANGED=1
            if [ -n "$CADDY_CHANGED" ]; then
              docker compose -f docker-compose.yml -f docker-compose.prod.yml restart caddy
            fi

            # Verify deployment; roll back to the previous SHA's images on failure.
            sleep 10
            if ! check_health; then
              echo "Health check failed for ${{ github.sha }}, rolling back to $PREV_SHA"
              git checkout --force "$PREV_SHA"
              for svc in v2 v1 mcp; do
                docker pull "$IMAGE_BASE/$svc:$PREV_SHA"
                docker tag "$IMAGE_BASE/$svc:$PREV_SHA" "$IMAGE_BASE/$svc:latest"
              done
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
              if [ -n "$CADDY_CHANGED" ]; then
                docker compose -f docker-compose.yml -f docker-compose.prod.yml restart caddy
              fi
              sleep 10
              check_health
              exit 1
            fi

            docker image prune -f
