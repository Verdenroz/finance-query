name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: V2 (Rust)
            context: .
            file: server/Dockerfile
            suffix: v2
            # translation-offline disabled temporarily
            build-args: CARGO_FEATURES=translation
          - name: V1 (Python)
            context: v1
            file: v1/Dockerfile
            suffix: v1
            build-args: ""
          - name: MCP
            context: .
            file: finance-query-mcp/Dockerfile
            suffix: mcp
            # translation-offline disabled temporarily
            build-args: CARGO_FEATURES=translation

    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name to lowercase
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image.name }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          build-args: ${{ matrix.image.build-args }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image.suffix }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image.suffix }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.suffix }}

  deploy-docs:
    name: Deploy docs site to GitHub Pages
    runs-on: ubuntu-latest
    permissions: {} # all repo access comes from the minted App token below

    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Mint a soothfast-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CHANGELOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Get soothfast-bot user id
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      # cargo soothfast docs gh-deploy pushes to gh-pages itself, so this
      # checkout needs its persisted, token-authenticated origin remote.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install nightly (rustdoc JSON for the docs engine)
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # A failing gate must not throw away the warm build state the
          # retry (and the docs-regen steps) would otherwise reuse.
          cache-on-failure: true
      - name: Install valgrind
        # CI VMs often expose no PMU, in which case
        # the auto backend gates on callgrind instruction counts instead.
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      # Pinned to the locked runner: soothfast-measure builds into the bench
      # binary from Cargo.lock, so an unpinned CLI silently outruns it.
      - name: Install cargo-binstall
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-binstall
      - name: Install cargo-soothfast
        # rust-cache can restore binstall's install record without the
        # binary itself; --force reinstalls past the stale record.
        run: |
          RUNNER=$(grep -A1 '^name = "soothfast"$' Cargo.lock | grep '^version' | cut -d'"' -f2)
          command -v cargo-soothfast >/dev/null || FORCE=--force
          cargo binstall cargo-soothfast --version "$RUNNER" --locked --no-confirm ${FORCE:-}

      - name: Configure git identity for the gh-pages commit
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.app-user.outputs.id }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      # soothfast.yml's paths filter and [bot] exclusion let no-code commits
      # reach master, where gating them can only report noise. Also gates the
      # trend append
      - name: Detect benchmarkable changes
        id: bench_changes
        run: |
          if git diff --quiet HEAD~1 HEAD -- src benches Cargo.toml Cargo.lock finance-query-derive; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No benchmarked code changed since HEAD~1 — skipping the perf gate."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Writes .soothfast/gate-status.json, which `report render` reads to
      # color the gate badge. HEAD~1 is well-defined: master is linear.
      - name: Gate against previous commit
        if: steps.bench_changes.outputs.changed == 'true'
        run: |
          cargo soothfast gate -p finance-query --features bench-gate \
            --against-ref HEAD~1 --save-baseline base

      # A passing gate already saved the baseline; measure only fills in
      # when the gate was skipped, so docs regen never runs without one.
      - name: Measure baseline for claims
        run: |
          if [ ! -f .soothfast/baselines/base.json ]; then
            cargo soothfast measure -p finance-query --features bench-gate --save-baseline base
          fi

      - name: Append performance trend point
        if: steps.bench_changes.outputs.changed == 'true'
        run: cargo soothfast trend append -p finance-query --from-baseline base

      # Direct pushes to master are blocked by the branch ruleset, so the bot
      # opens a PR and squash-merges it itself instead.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.bench_changes.outputs.changed == 'true'
        id: cpr
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: .soothfast/trend.jsonl
          commit-message: "chore: append performance trend point"
          title: "chore: append performance trend point"
          body: Automated performance trend update.
          branch: bot/trend-update
          delete-branch: true
          author: >-
            ${{ steps.app-token.outputs.app-slug }}[bot]
            <${{ steps.app-user.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
      - name: Merge pull request
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge --auto --squash --delete-branch "$PR_NUMBER"

      - name: Regenerate endpoint reference pages
        # A bare `wait` after backgrounding both would mask their exit codes.
        run: |
          cargo soothfast docs routes -p finance-query-server --target soothfast-routes --out docs/server &
          server=$!
          cargo soothfast docs routes -p finance-query-mcp --target soothfast-routes --out docs/server &
          mcp=$!
          status=0
          wait "$server" || status=1
          wait "$mcp" || status=1
          [ "$status" -eq 0 ] || exit "$status"
          cargo soothfast spec html -p finance-query-server --target soothfast-routes --out docs/server/api
          cargo soothfast spec html -p finance-query-mcp --target soothfast-routes --out docs/server/api

      - name: Regenerate API reference, perf report, coverage page, and llms.txt
        run: |
          cargo soothfast docs reference -p finance-query --baseline base --features full --out docs/reference
          cargo soothfast report render -p finance-query --baseline base --features full --out docs/perf
          mv docs/perf/llms.txt docs/llms.txt
          cp docs/llms.txt llms.txt
          { echo "# Coverage"; echo; \
            echo "> Generated by \`cargo soothfast coverage docs\`."; echo; \
            echo '```text'; \
            cargo soothfast coverage docs -p finance-query --features full \
              --badge docs/perf/badges/coverage.json --badge docs/perf/badges/coverage.svg; \
            echo '```'; } > docs/coverage.md

      - name: Build and publish docs site
        run: cargo soothfast docs gh-deploy --baseline base

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions: {}
    # Only deploy on master branch pushes, not PRs
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Deploy via SSH
        uses: appleboy/ssh-action@823bd89e131d8d508129f9443cad5855e9ba96f0 # v1.2.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/finance-query
            set -a; . ./.env 2>/dev/null || true; set +a
            IMAGE_BASE="ghcr.io/${GITHUB_REPO:-verdenroz/finance-query}"
            PREV_SHA=$(git rev-parse HEAD)

            check_health() {
              curl -f http://localhost/v2/health \
                && curl -f http://localhost/v1/health \
                && curl -f http://localhost/mcp/health
            }

            # Pin the on-disk checkout to the exact commit being deployed —
            # an out-of-band sync can otherwise leave docker-compose.prod.yml
            # stale relative to the images this job just pushed.
            git fetch origin master
            git checkout --force ${{ github.sha }}

            # docker-compose.prod.yml is an overlay on docker-compose.yml
            # Pull latest images
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            # Deploy with zero-downtime
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            # Verify deployment; roll back to the previous SHA's images on failure.
            sleep 10
            if ! check_health; then
              echo "Health check failed for ${{ github.sha }}, rolling back to $PREV_SHA"
              git checkout --force "$PREV_SHA"
              for svc in v2 v1 mcp; do
                docker pull "$IMAGE_BASE/$svc:$PREV_SHA"
                docker tag "$IMAGE_BASE/$svc:$PREV_SHA" "$IMAGE_BASE/$svc:latest"
              done
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
              sleep 10
              check_health
              exit 1
            fi

            # Cleanup old images
            docker image prune -f
