name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build ${{ matrix.image.name }}
    # Not a blanket [bot] test: dependabot's base-image bumps must still rebuild.
    # The bot also merges labelled PRs, so skip by commit author, not actor.
    if: github.event.head_commit.author.name != 'soothfast-bot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: V2 (Rust)
            context: .
            file: server/Dockerfile
            suffix: v2
            no-cache-filters: runtime
            # translation-offline disabled temporarily
            build-args: CARGO_FEATURES=translation
          - name: V1 (Python)
            context: v1
            file: v1/Dockerfile
            suffix: v1
            no-cache-filters: ""
            build-args: ""
          - name: MCP
            context: .
            file: finance-query-mcp/Dockerfile
            suffix: mcp
            no-cache-filters: runtime
            # translation-offline disabled temporarily
            build-args: CARGO_FEATURES=translation

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name to lowercase
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image.name }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          build-args: ${{ matrix.image.build-args }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image.suffix }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image.suffix }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.suffix }}
          no-cache-filters: ${{ matrix.image.no-cache-filters }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.suffix }}

  capture-docs:
    name: Regenerate captured doc output
    if: github.event.head_commit.author.name != 'soothfast-bot[bot]'
    runs-on: ubuntu-latest
    environment: soothfast-bot
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout soothfast-bot scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Verdenroz/soothfast
          ref: 0133aac6fa2b234af05df56da04b2a246af6f9a1 # v0.6.0
          path: soothfast-action
          sparse-checkout: action
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-soothfast
        uses: Verdenroz/soothfast@0133aac6fa2b234af05df56da04b2a246af6f9a1 # v0.6.0
        with:
          gate: false
          labels: "false"
          changelog: false

      - name: Regenerate captured doc output
        # dataframe.md/finance.md/ticker.md/tickers.md excluded: they capture
        # live Yahoo data (real prices/timestamps).
        run: |
          cargo soothfast docs capture -p finance-query --features full \
            docs/library/backtesting.md docs/library/commodities.md \
            docs/library/configuration.md docs/library/crypto.md docs/library/economic.md \
            docs/library/error-handling.md docs/library/feeds.md docs/library/filings.md \
            docs/library/forex.md docs/library/futures.md docs/library/getting-started.md \
            docs/library/indicators.md docs/library/indices.md docs/library/providers/alphavantage.md \
            docs/library/providers/coingecko.md docs/library/providers/edgar.md \
            docs/library/providers/fmp.md docs/library/providers/fred.md docs/library/providers/index.md \
            docs/library/providers/polygon.md docs/library/risk.md docs/library/screeners.md \
            docs/library/streaming.md docs/library/translation.md README.md

      # Minted after every step that compiles the tree has run.
      - name: Mint a soothfast-bot token
        id: bot
        run: soothfast-action/action/bot-token.sh
      # No BRANCH: the commit joins the soothfast workflow's landing for this
      # push when that pull request is still open.
      - name: Land the captured output
        env:
          TOKEN: ${{ steps.bot.outputs.token }}
          APP_SLUG: ${{ steps.bot.outputs.app_slug }}
          TITLE: "chore: regenerate captured doc output"
          PATHS: docs/library README.md
        run: soothfast-action/action/land.sh
      - name: Revoke the soothfast-bot token
        if: always() && steps.bot.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: gh api -X DELETE /installation/token || true

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions: {}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/finance-query
            set -a; . ./.env 2>/dev/null || true; set +a
            IMAGE_BASE="ghcr.io/${GITHUB_REPO:-verdenroz/finance-query}"
            PREV_SHA=$(git rev-parse HEAD)

            check_health() {
              curl -f http://localhost/v2/health \
                && curl -f http://localhost/v1/health \
                && curl -f http://localhost/mcp/health
            }

            # Pins the checkout to the deployed commit, so an out-of-band
            # sync can't leave docker-compose.prod.yml stale.
            git fetch origin master
            git checkout --force ${{ github.sha }}

            # docker-compose.prod.yml is an overlay on docker-compose.yml
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            # up -d ignores bind-mount content changes, and caddy reload would
            # skip the password substitution the entrypoint does at start.
            git diff --quiet "$PREV_SHA" ${{ github.sha }} -- Caddyfile || CADDY_CHANGED=1
            if [ -n "$CADDY_CHANGED" ]; then
              docker compose -f docker-compose.yml -f docker-compose.prod.yml restart caddy
            fi

            # Verify deployment; roll back to the previous SHA's images on failure.
            sleep 10
            if ! check_health; then
              echo "Health check failed for ${{ github.sha }}, rolling back to $PREV_SHA"
              git checkout --force "$PREV_SHA"
              for svc in v2 v1 mcp; do
                docker pull "$IMAGE_BASE/$svc:$PREV_SHA"
                docker tag "$IMAGE_BASE/$svc:$PREV_SHA" "$IMAGE_BASE/$svc:latest"
              done
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
              if [ -n "$CADDY_CHANGED" ]; then
                docker compose -f docker-compose.yml -f docker-compose.prod.yml restart caddy
              fi
              sleep 10
              check_health
              exit 1
            fi

            docker image prune -f
