name: Publish to crates.io

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

permissions:
  contents: read

jobs:
  test:
    name: Pre-publish Tests
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Run tests
        # Not --all-features: that pulls in `translation-offline`, which builds
        # CTranslate2 from source and needs cmake + a C++ toolchain.
        run: cargo test --features full --verbose

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [test]
    environment: release
    permissions:
      id-token: write # mint a short-lived crates.io token via OIDC
      contents: write # create the GitHub Release
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Verify version matches tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      - name: Authenticate to crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

      - name: Publish finance-query-derive
        run: cargo publish -p finance-query-derive
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Wait for crates.io to index
        run: sleep 30

      - name: Publish finance-query-types
        run: cargo publish -p finance-query-types
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Wait for crates.io to index
        run: sleep 30

      - name: Publish finance-query-backtesting
        run: cargo publish -p finance-query-backtesting
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Wait for crates.io to index
        run: sleep 30

      - name: Publish finance-query
        run: cargo publish -p finance-query
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Extract CHANGELOG for this version
        id: changelog
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          CHANGELOG_CONTENT=$(bash .github/scripts/extract_changelog.sh "$TAG_VERSION" CHANGELOG.md || echo "")
          if [ -z "$CHANGELOG_CONTENT" ]; then
            echo "No CHANGELOG entry found for version $TAG_VERSION, using auto-generated notes"
            echo "use_auto=true" >> $GITHUB_OUTPUT
          else
            echo "use_auto=false" >> $GITHUB_OUTPUT
            # Save to file to preserve formatting
            echo "$CHANGELOG_CONTENT" > /tmp/release_notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          USE_AUTO: ${{ steps.changelog.outputs.use_auto }}
        run: |
          if [ "$USE_AUTO" = "true" ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file /tmp/release_notes.md
          fi

  mcp-registry:
    name: Publish to the MCP Registry
    runs-on: ubuntu-latest
    needs: [publish]
    # The listing points at the hosted server, which only ever runs a release.
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      id-token: write # the registry verifies the io.github.Verdenroz namespace via OIDC
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify server.json version matches tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          SERVER_VERSION=$(jq -r .version server.json)
          if [ "$TAG_VERSION" != "$SERVER_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match server.json version ($SERVER_VERSION)"
            exit 1
          fi

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to the MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
