name: Prune Stale Caches

# Runs after CI finishes on master, plus a weekly sweep for caches from
# other master-only workflows. Covers every ref, not just master, since PR
# branches accumulate most of the stale generations.
# workflow_run only fires for master's own runs, so fork PRs can't trigger
# this; it only calls the Actions cache API regardless.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prune:
    name: Prune superseded rust-cache generations
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // rust-cache keys: "v0-rust-<job>-<os>-<envhash>-<lockhash>". Either
            // hash changing orphans the previous generation (restore-key always
            // prefers the newest match, nothing deletes the rest), so stripping
            // both hashes groups every generation of a job under one family.
            // Docker's buildkit-blob-*/index-* caches are content-addressed per
            // layer, not per generation, so they're excluded here.
            const RUST_CACHE = /^v0-rust-/;
            const PR_REF = /^refs\/pull\/(\d+)\/merge$/;

            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            let freedBytes = 0;
            let deletedCount = 0;
            const drop = async (c, why) => {
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: c.id,
              });
              freedBytes += c.size_in_bytes;
              deletedCount++;
              console.log(`Deleted ${why} cache "${c.key}" on ${c.ref} (${(c.size_in_bytes / 1024 / 1024).toFixed(0)} MB, created ${c.created_at})`);
            };

            const rust = caches.filter((c) => RUST_CACHE.test(c.key));

            // A merged/closed PR will never restore its caches again, so the whole
            // generation goes, not just the superseded ones.
            const prState = new Map();
            const live = [];
            for (const c of rust) {
              const pr = PR_REF.exec(c.ref)?.[1];
              if (!pr) { live.push(c); continue; }
              if (!prState.has(pr)) {
                const { data } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: Number(pr),
                });
                prState.set(pr, data.state);
              }
              if (prState.get(pr) === "closed") await drop(c, "closed-PR");
              else live.push(c);
            }

            // Within each ref, keep only the newest generation per job family.
            const families = new Map();
            for (const c of live) {
              const family = `${c.ref}\n${c.key.replace(/-[0-9a-f]+-[0-9a-f]+$/, "")}`;
              if (!families.has(family)) families.set(family, []);
              families.get(family).push(c);
            }
            for (const entries of families.values()) {
              entries.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              for (const stale of entries.slice(1)) await drop(stale, "superseded");
            }

            console.log(`Pruned ${deletedCount} stale cache(s), freed ${(freedBytes / 1024 / 1024 / 1024).toFixed(2)} GiB.`);
