name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Skips downstream jobs a docs-only / single-crate PR can't have broken.
  changes:
    name: Detect Changes
    if: github.event_name != 'pull_request' || !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      server_docker: ${{ steps.filter.outputs.server_docker }}
      mcp_docker: ${{ steps.filter.outputs.mcp_docker }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'server/**'
              - 'finance-query-mcp/**'
              - 'finance-query-derive/**'
              - 'benches/**'
              - 'tests/**'
              - 'fuzz/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              - '!server/CHANGELOG.md'
              - '!finance-query-mcp/CHANGELOG.md'
            server_docker:
              - 'src/**'
              - 'server/**'
              - 'finance-query-derive/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '!server/CHANGELOG.md'
            mcp_docker:
              - 'src/**'
              - 'finance-query-mcp/**'
              - 'finance-query-derive/**'
              - 'Cargo.toml'
              - '!finance-query-mcp/CHANGELOG.md'
              - 'Cargo.lock'
            fuzz:
              - 'src/**'
              - 'fuzz/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      # Symlinks the system linker to mold for faster builds.
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # check-only artifacts; sharing test-suite let this job's save
          # starve the test jobs, which then recompiled everything
          shared-key: clippy
      # `full` excludes translation-offline (native CTranslate2 build,
      # covered by the Docker jobs instead).
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --features finance-query/full -- -D warnings

  test-unit:
    name: Test Suite (unit)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: test-suite
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: nextest
      # `full` excludes translation-offline (native CTranslate2 build,
      # covered by the Docker jobs instead).
      - name: Run unit tests (full features)
        run: cargo nextest run --workspace --features finance-query/full

  test-network:
    name: Test Suite (network)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # default features, unlike the full-features test-suite key
          shared-key: test-network
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: nextest
      - name: Run network integration tests
        run: cargo nextest run --workspace --profile ci-network --run-ignored ignored-only

  test-doctest:
    name: Test Suite (doctest)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: test-suite
      # `full` excludes translation-offline (native CTranslate2 build,
      # covered by the Docker jobs instead).
      - name: Run doctests
        run: cargo test --workspace --doc --features finance-query/full

  # Keeps the "Test Suite" required-status-check name stable across the
  # 3-job split. `always()` matters: without it a sub-job failure cascades
  # this to skipped, and GitHub treats a skipped required check as passing.
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [changes, test-unit, test-network, test-doctest]
    if: always() && needs.changes.outputs.rust == 'true'
    steps:
      - name: Check suite results
        run: |
          for result in "${{ needs.test-unit.result }}" "${{ needs.test-network.result }}" "${{ needs.test-doctest.result }}"; do
            if [ "$result" != "success" ]; then
              echo "A test suite did not succeed: $result"
              exit 1
            fi
          done

  build-check-server:
    name: Build Check (server)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: check
      - name: Check server (release profile)
        run: cargo check --release -p finance-query-server --verbose

  build-check-mcp:
    name: Build Check (mcp)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: check
      # mcp path-deps on server for its in-process GraphQL schema.
      - name: Check mcp (release profile)
        run: cargo check --release -p finance-query-mcp --verbose

  # Validates the lib's actual default-feature build (clippy/test force `full`).
  build-check-lib:
    name: Build Check (lib)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: check-lib-default
      - name: Check lib (default features)
        run: cargo check --release -p finance-query --verbose
      # Deliberately not --workspace/--all-targets: those unify the server's and
      # dev-deps' wider feature sets over the library's, hiding a feature a
      # crates.io consumer would need.
      - name: Check lib (full features, no workspace unification)
        run: cargo check -p finance-query --features full --verbose
      # The test job runs with `full`, so a test that assumes a feature-gated
      # item exists passes there and fails for anyone running the documented
      # `cargo test -p finance-query`. Covers tests/ too: the wire-format pin
      # is an integration test, so --lib would leave it unguarded.
      - name: Test lib (default features)
        run: cargo test -p finance-query --tests --verbose
      # `cargo test --doc` compiles examples but never resolves intra-doc
      # links, so a broken one ships as dead text on docs.rs with nothing
      # failing. This is the only job that builds rustdoc. The deny lives here
      # rather than in lib.rs: a link to a feature-gated item is unresolvable
      # without that feature, so a crate attribute would break `cargo doc` for
      # every consumer not building `full`.
      - name: Build rustdoc (deny broken links)
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc -p finance-query --no-deps --features full
      # Default and full both hide cfg mismatches: a re-export gated on fewer
      # features than the item it exports compiles under either, and fails only
      # for a consumer enabling one provider.
      - name: Check lib (each feature alone)
        run: |
          for f in alphavantage polygon fmp fred crypto worldbank fiscaldata bls \
                   frankfurter binance kraken finra openfigi defi gdelt cftc \
                   nasdaq wikipedia secftd housetrades indicators risk dataframe \
                   backtesting sentiment translation; do
            echo "::group::--features $f"
            cargo check -p finance-query --lib --features "$f" || exit 1
            echo "::endgroup::"
          done

  build-release:
    name: Build Release (binaries)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    if: github.event_name == 'push' && needs.fmt.result == 'success' && needs.clippy.result == 'success'
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: build-fat
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Embeds the dependency manifest so binaries can be scanned with
      # `cargo audit bin` later.
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-auditable
      # Root crate is a library; the shippable binaries are workspace members.
      - name: Build release binaries
        run: cargo auditable build --workspace --release --verbose
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finance-query-linux-x86_64
          path: |
            target/release/finance-query-server
            target/release/fq
            target/release/fq-mcp
          if-no-files-found: error

  # Required-status-check name preserved as "Build Release" for branch protection.
  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [changes, build-check-server, build-check-mcp, build-check-lib, build-release]
    if: always() && needs.changes.outputs.rust == 'true'
    steps:
      - name: Check build results
        run: |
          for result in "${{ needs.build-check-server.result }}" "${{ needs.build-check-mcp.result }}" "${{ needs.build-check-lib.result }}"; do
            if [ "$result" != "success" ]; then
              echo "A build check did not succeed: $result"
              exit 1
            fi
          done
          release_result="${{ needs.build-release.result }}"
          if [ "$release_result" != "success" ] && [ "$release_result" != "skipped" ]; then
            echo "Build Release (binaries) did not succeed: $release_result"
            exit 1
          fi

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.server_docker == 'true'
    permissions:
      contents: read
      security-events: write # upload Trivy SARIF to code scanning
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: server/Dockerfile
          build-args: CARGO_FEATURES=translation
          push: false
          load: true
          tags: financequery:v2-ci
          cache-from: type=gha,scope=docker-server
          cache-to: type=gha,mode=max,scope=docker-server
      - name: Test Docker image
        run: |
          docker run -d --name test-container -p 8000:8000 financequery:v2-ci
          sleep 5
          docker exec test-container curl -f http://localhost:8000/v2/health || true
          docker stop test-container
          docker rm test-container
      # Trivy also reads the cargo-auditable manifest embedded in the binary,
      # so the shipped artifact is scanned, not just the base image.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: financequery:v2-ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
      - name: Upload Trivy results to code scanning
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-server

  docker-mcp:
    name: MCP Docker Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mcp_docker == 'true'
    permissions:
      contents: read
      security-events: write # upload Trivy SARIF to code scanning
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build MCP Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: finance-query-mcp/Dockerfile
          build-args: CARGO_FEATURES=translation
          push: false
          load: true
          tags: financequery:mcp-ci
          cache-from: type=gha,scope=docker-mcp
          cache-to: type=gha,mode=max,scope=docker-mcp
      - name: Test MCP Docker image
        run: |
          docker run -d --name test-mcp -p 3000:3000 -e MCP_TRANSPORT=http financequery:mcp-ci
          sleep 10
          curl -f http://localhost:3000/health
          docker stop test-mcp
          docker rm test-mcp
      # Trivy also reads the cargo-auditable manifest embedded in the binary,
      # so the shipped artifact is scanned, not just the base image.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: financequery:mcp-ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
      - name: Upload Trivy results to code scanning
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-mcp

  # Nightly toolchain required for the fuzz targets.
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-fuzz
      - name: Build fuzz targets
        run: cargo fuzz build --dev --target x86_64-unknown-linux-gnu
        working-directory: fuzz
      - name: Run fuzz_quote (30 s)
        run: cargo fuzz run fuzz_quote --dev --target x86_64-unknown-linux-gnu -- -max_total_time=30
        working-directory: fuzz
      - name: Run fuzz_chart (30 s)
        run: cargo fuzz run fuzz_chart --dev --target x86_64-unknown-linux-gnu -- -max_total_time=30
        working-directory: fuzz
      - name: Run fuzz_atr (30 s)
        run: cargo fuzz run fuzz_atr --dev --target x86_64-unknown-linux-gnu -- -max_total_time=30
        working-directory: fuzz
      - name: Run fuzz_indicators_series (30 s)
