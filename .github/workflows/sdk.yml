name: SDK

on:
  pull_request:
    paths:
      - "sdks/**"
      - ".github/workflows/sdk.yml"

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # No Rust toolchain: the generated package must stand on its own.
  quality:
    name: Type-check generated SDK
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: mypy --strict
        run: uv run --no-project --with mypy --with httpx mypy --strict sdks/python/src/finance_query
      - name: Package imports and builds
        run: |
          uv run --no-project --with httpx python -c "
          import sys; sys.path.insert(0, 'sdks/python/src')
          import finance_query
          print(finance_query.__version__, len(finance_query.__all__), 'exports')"
          uv build sdks/python
