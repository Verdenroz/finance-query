name: soothfast-comment

# Written by `cargo soothfast init`; `cargo soothfast init --check` reports drift.
# Comments the verdict of a fork's pull request, whose own run cannot. The
# trigger is safe here: nothing of the pull request is checked out and its
# artifacts are only read as data.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [soothfast]
    types: [completed]

permissions: {}

jobs:
  comment:
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    uses: Verdenroz/soothfast/.github/workflows/comment.yml@78ff082afdf6139b61731e73aede79bfc13a15e9 # master, after v0.9.1
    with:
      soothfast_ref: "78ff082afdf6139b61731e73aede79bfc13a15e9"
