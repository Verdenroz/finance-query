name: SDK Publish

# Version lockstep with the crate, not independently versioned.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish SDK to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install nightly (rustdoc JSON)
        run: rustup toolchain install nightly --profile minimal
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Install cargo-soothfast
        uses: Verdenroz/soothfast@b01b08e2127c3dab574bae40086f6e8b2efe377e # v0.10.0
        with:
          gate: false
          labels: "false"
          changelog: false
      - name: Publish
        run: cargo soothfast sdk publish -p finance-query-server --target soothfast-routes --only python
