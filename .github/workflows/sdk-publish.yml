name: SDK Publish

# Version lockstep with the crate, not independently versioned.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish SDK to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install nightly (rustdoc JSON)
        run: rustup toolchain install nightly --profile minimal
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Install cargo-soothfast
        uses: Verdenroz/soothfast@db5df2c43c4861d0734f111fa765c6bf776a6fb1 # v0.5.0
        with:
          gate: false
          changelog: false
      - name: Publish
        run: cargo soothfast sdk publish -p finance-query-server --target soothfast-routes --only python
