name: SDK Publish

# Version lockstep with the crate, not independently versioned.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish SDK to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install nightly (rustdoc JSON)
        run: rustup toolchain install nightly --profile minimal
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Install cargo-soothfast
        uses: Verdenroz/soothfast@69e2e9250414bd1dcaa1f45529f1e3fe12c593dd # v0.3.2
        with:
          gate: false
          changelog: false
      - name: Publish
        run: cargo soothfast sdk publish -p finance-query-server --target soothfast-routes --only python
